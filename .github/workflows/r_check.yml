name: R CMD check

on:
  push:
    paths:
      - 'src/opentimsr/**'
      - 'src/opentims\+\+/**'
      - 'pytest/test.d/**'
      - 'CHANGELOG.md'
      - '.github/workflows/r_check.yml'
  pull_request:
    paths:
      - 'src/opentimsr/**'
      - 'src/opentims\+\+/**'
      - 'pytest/test.d/**'
      - 'CHANGELOG.md'
      - '.github/workflows/r_check.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check (default the triggering commit)
        type: string
        default: ''

jobs:
  build:
    # Build on Linux: R CMD build resolves the symlinks (opentims_core,
    # inst/extdata/test.d), which Windows checkouts would break.
    name: Build source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Build tarball
        run: R CMD build src/opentimsr

      - uses: actions/upload-artifact@v4
        with:
          name: opentimsr-tarball
          path: opentimsr_*.tar.gz

  check:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}${{ matrix.config.cran && ' / --as-cran' || '' }}
    needs: build
    runs-on: ${{ matrix.config.os }}
    continue-on-error: ${{ matrix.config.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        # cran: R CMD check --as-cran, as CRAN runs it on submission. The
        # plain R CMD check is what users and other repositories run.
        config:
          - {os: windows-latest, r: release, cran: true}
          - {os: windows-latest, r: release, cran: false}
          - {os: windows-11-arm, r: release, cran: true, experimental: true}
          - {os: macos-latest, r: release, cran: true}
          - {os: macos-latest, r: release, cran: false}
          - {os: ubuntu-latest, r: release, cran: true}
          - {os: ubuntu-latest, r: release, cran: false}
          - {os: ubuntu-latest, r: devel, cran: true}
          - {os: ubuntu-latest, r: '4.3', cran: true}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Skip CRAN incoming checks that query remote servers.
      _R_CHECK_CRAN_INCOMING_REMOTE_: false
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opentimsr-tarball

      - name: Install zstd (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Install zstd (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd pkg-config

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # --as-cran checks NEWS.md with pandoc, and warns if it is missing.
      - uses: r-lib/actions/setup-pandoc@v2

      - name: Extract DESCRIPTION for dependency resolution
        run: tar xzf opentimsr_*.tar.gz opentimsr/DESCRIPTION

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: opentimsr
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check tarball
        shell: Rscript {0}
        env:
          AS_CRAN: ${{ matrix.config.cran }}
        run: |
          rcmdcheck::rcmdcheck(
            Sys.glob("opentimsr_*.tar.gz"),
            args = c(if (Sys.getenv("AS_CRAN") == "true") "--as-cran", "--no-manual"),
            error_on = "warning",
            check_dir = "check"
          )

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.config.os }}-r${{ matrix.config.r }}${{ matrix.config.cran && '-as-cran' || '' }}
          path: check
