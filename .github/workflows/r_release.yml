name: R release

# On a v* tag, attach installable packages to the GitHub release:
# - opentimsr_X.tar.gz: the R source package (built on Linux, so the
#   symlinks are resolved);
# - opentimsr_X.zip: a Windows binary of it (no Rtools needed);
# - opentims-X.tar.gz: the whole repository with symlinks replaced by
#   copies, installable with remotes (subdir) and pip on any platform.
#
# Run manually (workflow_dispatch) without a tag to build and test the files
# from the chosen branch; they are then only kept as run artifacts. With a
# tag, the files are built from that tag and attached to its release.

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and attach to its release (empty to only build and test)
        type: string
        default: ''

jobs:
  version:
    name: Check DESCRIPTION version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine tag
        id: tag
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          if [ -n "$TAG" ] && ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::No such tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # R versions cannot carry pre-release suffixes, so v1.2.0b4 must match
      # Version: 1.2.0.
      - name: Compare tag with DESCRIPTION
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          base="$(echo "${TAG#v}" | sed -E 's/^([0-9]+(\.[0-9]+)*).*/\1/')"
          desc="$(git show "refs/tags/$TAG:src/opentimsr/DESCRIPTION" | sed -n 's/^Version: *//p')"
          if [ "$base" != "$desc" ]; then
            echo "::error::Tag $TAG does not match DESCRIPTION Version $desc"
            exit 1
          fi

  check:
    needs: version
    uses: ./.github/workflows/r_check.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  windows_binary:
    name: Windows binary
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opentimsr-tarball

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Extract DESCRIPTION for dependency resolution
        run: tar xzf opentimsr_*.tar.gz opentimsr/DESCRIPTION

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: opentimsr

      - name: Build binary
        run: |
          mkdir binary
          cd binary
          R CMD INSTALL --build ../opentimsr_*.tar.gz

      - name: Install the binary into a fresh library and read the test data
        shell: Rscript {0}
        run: |
          lib <- file.path(tempdir(), "lib")
          dir.create(lib)
          install.packages(Sys.glob("binary/opentimsr_*.zip"), lib = lib, repos = NULL)
          library(opentimsr, lib.loc = lib)
          setup_opensource()
          D <- OpenTIMS(system.file("extdata", "test.d", package = "opentimsr", lib.loc = lib))
          stopifnot(nrow(query(D, frames = 1L)) > 0)
          CloseTIMS(D)

      - uses: actions/upload-artifact@v4
        with:
          name: opentimsr-windows-binary
          path: binary/opentimsr_*.zip

  source_archive:
    name: Repository archive without symlinks
    needs: version
    runs-on: ubuntu-latest
    steps:
      # The script comes from this commit; the archived tree from the tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build archive
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            .github/scripts/make_source_archive.sh "refs/tags/$TAG" "opentims-${TAG#v}" dist
          else
            .github/scripts/make_source_archive.sh HEAD "opentims-$(git rev-parse --short HEAD)" dist
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: opentimsr-repository-archive
          path: dist/*.tar.gz

  release:
    name: Attach to GitHub release
    needs: [version, windows_binary, source_archive]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opentimsr-*
          path: dist
          merge-multiple: true

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "${TAG#v}" in
              *[!0-9.]*) prerelease="--prerelease" ;;
            esac
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --generate-notes $prerelease
          fi
          gh release upload "$TAG" dist/* --clobber
